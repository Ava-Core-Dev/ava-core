name = "ava-api"
main = "src/ava-api/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "d2daf26398a805b29e12ddba2b2228cf"

# Routes for avaivy.cloud
routes = [
  { pattern = "avaivy.cloud/*", zone_name = "avaivy.cloud" },
  { pattern = "api.avaivy.cloud/*", zone_name = "avaivy.cloud" },
]

# D1 binding for heartbeat
[[d1_databases]]
binding = "AVA_HEARTBEAT_DB"
database_name = "ava-heartbeat"
database_id = "9991d162-a07f-4931-aa2f-2fbe6edc33c0"   # fill after creating DB

[vars]
AVA_ORIGIN_URL = "https://origin.avaivy.cloud"

# Scheduled triggers — stand down when Ava is awake (heartbeat gate)
[triggers]
crons = ["*/5 * * * *"]
