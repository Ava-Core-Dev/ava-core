<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ava System Board</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#07100d;--panel:#0d1a15;--panel2:#10231b;--line:#254334;--text:#e9f4ed;--muted:#8fa99a;--accent:#74d69b;--warn:#f2c96d;--bad:#ff7f7f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#10251b 0,#07100d 48%,#050908 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:1500px;margin:auto;padding:24px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:22px}.brand h1{margin:0;font-size:clamp(1.7rem,3vw,2.6rem);letter-spacing:.02em}.brand p{margin:5px 0 0;color:var(--muted)}.status{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:.9rem}.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{background:#102219;border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}.controls button.active{border-color:var(--accent);color:var(--accent)}.summary,.devices,.charts{display:grid;gap:14px}.summary{grid-template-columns:repeat(5,minmax(130px,1fr));margin-bottom:14px}.card{background:linear-gradient(145deg,rgba(16,35,27,.96),rgba(9,20,15,.96));border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.16)}.label{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.value{font-size:1.6rem;font-weight:700;margin-top:7px}.sub{font-size:.78rem;color:var(--muted);margin-top:5px}.devices{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:14px}.device-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.pill{font-size:.72rem;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}.online{color:var(--accent);border-color:#34754d}.offline{color:var(--bad);border-color:#713838}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:10px;background:rgba(0,0,0,.12);border-radius:9px}.metric b{display:block;font-size:1.05rem;margin-top:3px}.detail{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:7px;font-size:.8rem;color:var(--muted)}.charts{grid-template-columns:repeat(2,minmax(0,1fr))}.chart{height:310px}.chart.full{grid-column:1/-1}.empty{color:var(--muted);padding:28px;text-align:center}@media(max-width:1000px){.summary{grid-template-columns:repeat(3,1fr)}.devices,.charts{grid-template-columns:1fr}}@media(max-width:650px){.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand"><h1>Ava System Board</h1><p>Live energy telemetry, system state, and historical power analysis.</p></div><div><div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div><div class="controls" style="margin-top:10px"><button data-hours="1">1H</button><button data-hours="6">6H</button><button data-hours="12" class="active">12H</button><button data-hours="24">24H</button><button data-hours="72">3D</button></div></div></header>
<section class="summary" id="summary"><div class="card"><div class="label">System SOC</div><div class="value" id="sumSoc">—</div><div class="sub">Average of reporting devices</div></div><div class="card"><div class="label">Input</div><div class="value" id="sumIn">—</div><div class="sub">Current live watts</div></div><div class="card"><div class="label">Output</div><div class="value" id="sumOut">—</div><div class="sub">Current live watts</div></div><div class="card"><div class="label">Solar</div><div class="value" id="sumSolar">—</div><div class="sub">Current live watts</div></div><div class="card"><div class="label">Net Power</div><div class="value" id="sumNet">—</div><div class="sub">Input − output</div></div></section>
<section class="devices" id="devices"><div class="empty">Loading devices…</div></section>
<section class="charts"><div class="card chart"><canvas id="socChart"></canvas></div><div class="card chart"><canvas id="powerChart"></canvas></div><div class="card chart"><canvas id="solarChart"></canvas></div><div class="card chart"><canvas id="netChart"></canvas></div><div class="card chart full"><canvas id="energyChart"></canvas></div></section>
</main>
<script>
const API={now:'/system/api/now',history:h=>'/system/api/history?hours='+h};let hours=12, charts={};
const $=id=>document.getElementById(id), n=v=>Number(v||0), fmt=v=>Number.isFinite(n(v))?Math.round(n(v)).toLocaleString():'—', pct=v=>Number.isFinite(n(v))?Math.round(n(v))+'%':'—';
const colors=['#74d69b','#76b7ff','#f2c96d','#d98cff','#ff8d7f','#68d5d1'];
function keyName(r){return r.name||r.sn||'Unknown'}
function latestByName(now){const m=new Map();(now.live||[]).forEach(r=>m.set(keyName(r),{...r,source:'live'}));(now.enhanced||[]).forEach(r=>{let x=m.get(keyName(r))||{};m.set(keyName(r),{...r,...x,enhanced:r})});return [...m.values()]}
function drawSummary(rows){let soc=rows.map(r=>n(r.soc)).filter(Boolean);let sum=k=>rows.reduce((a,r)=>a+n(r[k]),0);$('sumSoc').textContent=soc.length?Math.round(soc.reduce((a,b)=>a+b,0)/soc.length)+'%':'—';$('sumIn').textContent=fmt(sum('in_w'))+' W';$('sumOut').textContent=fmt(sum('out_w'))+' W';$('sumSolar').textContent=fmt(sum('solar_w'))+' W';$('sumNet').textContent=fmt(sum('in_w')-sum('out_w'))+' W'}
function drawDevices(rows){$('devices').innerHTML=rows.map(r=>{let e=r.enhanced||{};return `<article class="card"><div class="device-head"><strong>${keyName(r)}</strong><span class="pill ${r.online?'online':'offline'}">${r.online?'ONLINE':'OFFLINE'}</span></div><div class="metrics"><div class="metric"><span class="label">SOC</span><b>${pct(r.soc??e.soc_avg)}</b></div><div class="metric"><span class="label">Input</span><b>${fmt(r.in_w??e.in_w_avg)} W</b></div><div class="metric"><span class="label">Output</span><b>${fmt(r.out_w??e.out_w_avg)} W</b></div><div class="metric"><span class="label">Solar</span><b>${fmt(r.solar_w??e.solar_w_avg)} W</b></div><div class="metric"><span class="label">Net</span><b>${fmt((r.in_w??e.in_w_avg)-(r.out_w??e.out_w_avg))} W</b></div><div class="metric"><span class="label">Trend</span><b>${e.trend||'—'}</b></div></div><div class="detail"><span>Δ SOC: ${e.soc_delta==null?'—':n(e.soc_delta).toFixed(2)+'%'}</span><span>Samples: ${e.samples??'—'}</span><span>Energy In: ${e.energy_in_wh==null?'—':n(e.energy_in_wh).toFixed(1)+' Wh'}</span><span>Energy Out: ${e.energy_out_wh==null?'—':n(e.energy_out_wh).toFixed(1)+' Wh'}</span></div></article>`}).join('')||'<div class="empty">No device data available.</div>'}
function makeChart(id,title,rows,fields,unit){if(charts[id])charts[id].destroy();let names=[...new Set(rows.map(keyName))];let labels=[...new Set(rows.map(r=>r.minute_key))];let by=new Map();rows.forEach(r=>{let k=keyName(r);if(!by.has(k))by.set(k,new Map());by.get(k).set(r.minute_key,r)});charts[id]=new Chart($(id),{type:'line',data:{labels:labels.map(x=>String(x).replace('T',' ').slice(5,16)),datasets:names.map((name,i)=>({label:name,borderColor:colors[i%colors.length],backgroundColor:colors[i%colors.length],pointRadius:0,borderWidth:2,tension:.25,data:labels.map(t=>{let r=by.get(name).get(t);return r?fields.reduce((a,f)=>a+n(r[f]),0):null})}))},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{title:{display:true,text:title,color:'#e9f4ed'},legend:{labels:{color:'#c6d8cc'}}},scales:{x:{ticks:{color:'#8fa99a',maxTicksLimit:10},grid:{color:'rgba(143,169,154,.08)'}},y:{title:{display:true,text:unit,color:'#8fa99a'},ticks:{color:'#8fa99a'},grid:{color:'rgba(143,169,154,.08)'}}}}})}
function drawCharts(rows){if(!rows.length){for(const id of ['socChart','powerChart','solarChart','netChart','energyChart']){if(charts[id])charts[id].destroy();const c=$(id);const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height)}return;}makeChart('socChart','Battery State of Charge',rows,['soc_avg'],'%');makeChart('powerChart','Input / Output',rows,['in_w_avg','out_w_avg'],'W (combined)'); // replace below with per metric aggregate chart
if(charts.powerChart)charts.powerChart.destroy();const labels=[...new Set(rows.map(r=>r.minute_key))], names=[...new Set(rows.map(keyName))], ds=[];['in_w_avg','out_w_avg'].forEach((field,fi)=>names.forEach((name,i)=>{let map=new Map(rows.filter(r=>keyName(r)===name).map(r=>[r.minute_key,n(r[field])]));ds.push({label:name+' '+(fi?'OUT':'IN'),borderColor:colors[(i+fi*3)%colors.length],pointRadius:0,borderDash:fi?[5,4]:[],tension:.25,data:labels.map(t=>map.get(t)??null)})}));charts.powerChart=new Chart($('powerChart'),{type:'line',data:{labels:labels.map(x=>String(x).replace('T',' ').slice(5,16)),datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:'Input / Output by Device',color:'#e9f4ed'},legend:{labels:{color:'#c6d8cc'}}},scales:{x:{ticks:{color:'#8fa99a',maxTicksLimit:8}},y:{ticks:{color:'#8fa99a'},title:{display:true,text:'W',color:'#8fa99a'}}}}});makeChart('solarChart','Solar Power',rows,['solar_w_avg'],'W');makeChart('netChart','Net Power',rows,['net_w_avg'],'W');if(charts.energyChart)charts.energyChart.destroy();charts.energyChart=new Chart($('energyChart'),{type:'bar',data:{labels:names,datasets:[{label:'Energy In (Wh)',data:names.map(name=>rows.filter(r=>keyName(r)===name).reduce((a,r)=>a+n(r.energy_in_wh),0))},{label:'Energy Out (Wh)',data:names.map(name=>rows.filter(r=>keyName(r)===name).reduce((a,r)=>a+n(r.energy_out_wh),0))}]},options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:'Energy over selected period',color:'#e9f4ed'},legend:{labels:{color:'#c6d8cc'}}},scales:{x:{ticks:{color:'#8fa99a'}},y:{ticks:{color:'#8fa99a'},title:{display:true,text:'Wh',color:'#8fa99a'}}}}})}
async function refreshLive(){try{let r=await fetch(API.now,{cache:'no-store'});if(!r.ok)throw Error(r.status);let data=await r.json(), rows=latestByName(data);drawSummary(rows);drawDevices(rows);$('status').textContent='Live · '+new Date(data.ts||Date.now()).toLocaleTimeString();$('dot').style.background='var(--accent)'}catch(e){console.error('live API',e);$('status').textContent='Live data unavailable';$('dot').style.background='var(--bad)'}}
async function refreshHistory(){try{let r=await fetch(API.history(hours),{cache:'no-store'});if(!r.ok)throw Error(r.status);let d=await r.json();drawCharts(d.rows||[])}catch(e){console.error('history',e)}}
async function refreshAll(){await Promise.all([refreshLive(),refreshHistory()])}document.querySelectorAll('[data-hours]').forEach(b=>b.onclick=()=>{hours=+b.dataset.hours;document.querySelectorAll('[data-hours]').forEach(x=>x.classList.toggle('active',x===b));refreshHistory()});refreshAll();setInterval(refreshLive,10000);setInterval(refreshHistory,60000);
</script></body></html>
