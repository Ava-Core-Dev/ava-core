# Per-app API Worker (full copy of `rootrecord-primary` source). Same D1 + R2 bindings. No first-party Worker crons for Kīlauea (USGS/device work is in the Android app). `WORKER_SHARD` for clarity only.
#
# Production: attach **https://api.rootrecord.online** to this Worker (Custom Domains / Routes) for the Kīlauea web app default (`VITE_ROOTRECORD_API_ORIGIN` / hostname detection).
# SSO cookies require API hosts under `*.rootrecord.info` (see `web-sso.ts`). Until then, set **VITE_ROOTRECORD_API_ORIGIN** on Kīlauea Pages to **https://api.rootrecord.online**.
#
# Secrets: JWT_SECRET (set by deploy.ps1 from credentials.env, optional Web/main/.env, and/or gitignored .deploy-* files).
#
# Optional: near–real-time air (AirNow) for Kīlauea Android home — GET /api/airnow/current
#   wrangler secret put AIRNOW_API_KEY   # https://docs.airnowapi.org/account/request/
#
# Optional: Kīlauea Android home screen — EPA AQS daily summaries (Hawaiʻi County) via GET /api/aqs/hawaii-county-daily
#   wrangler secret put AQS_API_EMAIL   # same email you used at https://aqs.epa.gov/data/api/signup?email=...
#   wrangler secret put AQS_API_KEY      # key from EPA email (not your account password)
#
# Cloudflare account: set CLOUDFLARE_ACCOUNT_ID in repo-root credentials.env (loaded by deploy.ps1), or run `wrangler login`.
# New D1 in a new account: `npx wrangler d1 create root-record` → paste database_id here and in credentials.env (D1_DATABASE_ID) and rootrecord-license/wrangler.toml.
name = "rootrecord-api-kilauea"
main = "src/index.ts"
compatibility_date = "2024-11-01"
# Solana web3 + SPL use Buffer in some paths; required for treasury→custodial txs in this Worker.
compatibility_flags = ["nodejs_compat"]

[triggers]
# `*/10` = USGS earthquakes (Big Island, M2.0+, ~150km of Kilauea) → Discord #kilauea-alerts,
# plus Kīlauea AI analysis reports for conservative triggers (migration 0054).
# Secrets: DISCORD_KILAUEA_BOT_TOKEN (preferred), DISCORD_KILAUEA_USGS_WEBHOOK_URL (fallback), GROK_*.
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "root-record"
database_id = "0b49c598-1f91-4a09-84a8-6ba8241c6df3"

[[r2_buckets]]
binding = "VOLCANO_PHOTOS"
bucket_name = "rootrecord-volcano-photos"

[[send_email]]
name = "EMAIL"

