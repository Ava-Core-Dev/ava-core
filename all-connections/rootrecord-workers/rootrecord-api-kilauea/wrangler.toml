# Developer feed (Settings → messages in mobile apps): GET /api/mobile/developer-messages?app_id=…
# Publish (ops): POST https://api.rootrecord.info/api/internal/developer-messages
# Kīlauea live streams (Android Live Feeds): GET /api/mobile/kilauea-live-streams
# Update one row (ops): POST …/api/internal/kilauea-live-streams  { id, watch_url, youtube_video_id?, title?, description?, sort_order? }
#   Header: X-RR-Push-Admin-Key: <same as push-broadcast>
# Kīlauea major-event page (Android home banner + hidden screen, D1 `kilauea_situation`):
#   GET  …/api/mobile/kilauea-situation
#   POST …/api/internal/kilauea-situation  { enabled, name?, body? }  — name required when enabled=true
#   Disable: { "enabled": false }  — keeps last name/body for next event
#   JSON: { "title": "…", "body": "…", "app_scope": "all" | "weather" | "bm" | "token_manager" | "account_hub" }
#
# Discord developer feed sync → Worker `rootrecord-solana-tx` (same D1 `developer_messages`).

# Internal custodial wallet encryption (AES-256-GCM). deploy.ps1 uploads INTERNAL_WALLET_ENC_KEY_B64
# Failsafe: application code never DELETEs `internal_solana_wallets` (encrypted keys) — even on DELETE /v1/me / inactive purge.
# (from credentials.env, or .deploy-internal-wallet-key, or auto-generated like JWT_SECRET).
# Manual: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))" | wrangler secret put INTERNAL_WALLET_ENC_KEY_B64
# Optional Discord channel for Solana tooling events (internal wallet provision, etc.):
#   wrangler secret put DISCORD_WEBHOOK_SOLANA_TOOLS
# In-app feedback (Kīlauea Android → POST /api/feedback):
#   Preferred: DISCORD_BOT_TOKEN posts to DISCORD_FEEDBACK_CHANNEL_ID.
#   Optional fallback: wrangler secret put DISCORD_FEEDBACK_WEBHOOK_URL
#   (paste full https://discord.com/api/webhooks/... URL — never commit it to git)
# Next.js Solana Tools site POST /api/solana-site/log → Worker (must match site env SOLANA_SITE_LOG_SECRET):
#   wrangler secret put SOLANA_SITE_LOG_SECRET
# New-mint Discord embed (Next proxies POST /api/solana-site/token-discord-notify with same Bearer):
#   wrangler secret put DISCORD_TOKEN_CREATE_WEBHOOK_URL
#
# Observability: every request logs one JSON line (`msg: http_request`, path redacted, status, ms, colo, ray).
# 5xx and very slow requests (≥25s) are also written to D1 `worker_http_error_events` (apply migration 0029).
# Pruned daily (cron 45 8 * * *). Operator read: GET /api/internal/recent-http-errors?limit=50 (X-RR-Push-Admin-Key).
# In Cloudflare Dashboard enable Workers Logs + optional Logpush to your SIEM for retention beyond the console.
#
# Legacy D1 tables from older Solana-site flows may exist (`ecosystem_otc_fulfillments`); migrations 0012+0013.
#
# When the Solana Tools hostname proxies /api/* here first, forward Next-only routes to Vercel:
#   wrangler secret put SOLANA_TOOLS_API_FORWARD_URL
#   Value: https://<project>.vercel.app   (no trailing slash)

# One-time / ops: provision custodial wallets for all `license_accounts` missing `internal_solana_wallets`
# (POST /api/internal/provision-custodial-wallets-missing, same X-RR-Push-Admin-Key as push-broadcast).
# Run treasury SOL top-up + RRTT payout cron immediately (same as 07:00 UTC schedule):
#   POST https://api.rootrecord.info/api/internal/run-rrtt-custodial-cron  (header X-RR-Push-Admin-Key: …)
# Treasury checks (proxied to `ROOTRECORD_SOLANA_TX_URL`; schedules: SOL :00 UTC, RRTT/RRESERVE :10 UTC, both from `*/5`):
#   POST https://api.rootrecord.info/api/internal/run-treasury-liquidity-check
#   POST https://api.rootrecord.info/api/internal/run-treasury-sol-lp-check
#   Header: X-RR-Push-Admin-Key (same as push-broadcast). Or call the solana-tx Worker `/api/internal/...` directly.
# Optional SPL top-up when LP withdraw is not enough: `wrangler secret put TREASURY_MAINTENANCE_SOURCE_SECRET_KEY_B58`
#   (Phantom-style base58 secret; pubkey must differ from treasury).
#   powershell -NoProfile -File ./provision-custodial-backfill.ps1
#
# All-device FCM broadcast (POST /api/internal/push-broadcast):
#   wrangler secret put RR_PUSH_ADMIN_SECRET
# Wallet admin on Solana Tools (`/admin/wallet-admin`): set a dedicated proxy secret (recommended):
#   wrangler secret put WALLET_ADMIN_PROXY_SECRET
# Same value on Vercel as WALLET_ADMIN_PROXY_SECRET. Fallback: reuse RR_PUSH_ADMIN_SECRET on Vercel + Worker.
#   wrangler secret put FCM_SERVICE_ACCOUNT_JSON
# (paste your Firebase service account JSON — one secret; optional split vars still supported)
#
# Email change (POST /api/me/email/request):
#   Dashboard → Email Sending → onboard rootrecord.info (SPF/DKIM/DMARC on cf-bounce.*).
#   Binding [[send_email]] name EMAIL is in this file; default from [vars] EMAIL_FROM.
#   Optional Resend fallback: wrangler secret put RESEND_API_KEY / RESEND_FROM

