# Root Goals API Worker — goals CRUD, onboarding drafts, Grok plans, public share by custodial address.
#
# Secrets: JWT_SECRET (deploy.ps1). Grok chat: GROK_API_BEARER_TOKEN (deploy.ps1 from GROK_API_BEARER_TOKEN, GROK_API_KEY, or GROK_X_BEARER_TOKEN in credentials.env).
#
name = "rootrecord-api-goals"
account_id = "2b317e91da019f4fdb854e3b8e26fa94"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "root-record"
database_id = "0b49c598-1f91-4a09-84a8-6ba8241c6df3"

[[r2_buckets]]
binding = "GOAL_MEDIA"
bucket_name = "rootrecord-volcano-photos"

[vars]
WORKER_SHARD = "goals"
SITE_URL = "https://g.rootrecord.info"
GOALS_SITE_ORIGIN = "https://rootrecord-online-1w3lh0j9h-root-record.vercel.app"
GROK_MODEL = "grok-3-latest"
GROK_API_URL = "https://api.x.ai/v1/chat/completions"
DISCORD_GUILD_ID = "1497039564345442406"
DISCORD_DEVELOPER_ROLE_ID = "1497040541559558175"
# App session starts → Discord #app-sessions (RootMC bot secret + channel id, same as BlockNotes).
DISCORD_APP_SESSION_CHANNEL_ID = "1545278495750361171"
# Root Goals AI report copies (embed) and raw JSON archive (same raw channel as Kīlauea AI).
DISCORD_ROOTGOALS_AI_COPY_CHANNEL_ID = "1511923750776606780"
DISCORD_ROOTGOALS_AI_RAW_ARCHIVE_CHANNEL_ID = "1545283818146242642"
SOLANA_CLUSTER = "auto"
GOAL_TOKEN_CLUSTER = "auto"
GOAL_TOKEN_RPC_URL = "https://api.devnet.solana.com"
# SOLANA_CLUSTER=auto issues on mainnet when treasury has ≥ 0.01 SOL, else devnet.
# Pin SOLANA_CLUSTER=devnet only while forcing testnet.
# INTERNAL_WALLET_ENC_KEY_B64, SOLANA_RPC_URL, RRTT_TREASURY_SECRET_KEY_B58.
# Optional: AVA_EMBER_MINT_BASE58 (Pump.fun Ava Embers mint). Operator can also POST /api/embers/config.

[[routes]]
pattern = "api-goals.rootrecord.info/*"
zone_name = "rootrecord.info"

[[routes]]
pattern = "g.rootrecord.info/*"
zone_name = "rootrecord.info"
