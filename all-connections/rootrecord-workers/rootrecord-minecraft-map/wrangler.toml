# RootMC BlueMap — static tiles on R2, live markers via thin origin proxy.
# Public URL: https://map.rootrecord.info
#
# Deploy Worker: cloudflare-update-workers.bat minecraft-map
# Create bucket (once): powershell -File ensure-r2-bucket.ps1
# Upload / sync tiles: powershell -File sync-bluemap-r2.ps1
#
# MAP_SERVE_MODE:
#   origin — proxy everything to game host :22784 (legacy)
#   hybrid — R2 when object exists, else origin (safe during migration)
#   r2     — R2 only (after full sync; live still uses /__bluemap-live proxy)
name = "rootrecord-minecraft-map"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[r2_buckets]]
binding = "BLUEMAP_ASSETS"
bucket_name = "rootrecord-bluemap"

[vars]
MAP_SERVE_MODE = "hybrid"
BLUEMAP_ORIGIN = "http://play.rootrecord.info:22784"
MAP_PUBLIC_HOST = "map.rootrecord.info"
BLUEMAP_LIVE_PROXY_PATH = "/__bluemap-live"

[[routes]]
pattern = "map.rootrecord.info"
custom_domain = true
