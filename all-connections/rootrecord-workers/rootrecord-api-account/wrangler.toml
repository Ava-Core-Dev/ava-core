#   JSON: { "title": "…", "body": "…", "app_scope": "all" | "weather" | "bm" | "token_manager" | "account_hub" }
#
# Discord announcements → D1 `developer_messages` (shared D1; single writer on this Worker). Set secret on this Worker:
#   wrangler secret put DISCORD_BOT_TOKEN
# (same bot token as previously on api-weather). Bot needs View Channel + Read Message History + Message Content intent.
