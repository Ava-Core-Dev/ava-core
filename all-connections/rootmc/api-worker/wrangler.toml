# RootMC API — dedicated Cloudflare account (rootmc.net). Not on RootRecord shards.
#
# Deploy: powershell -File deploy.ps1  (loads RootMC Workspace\.env)
# D1:     powershell -File d1-apply-remote.ps1
#
# Secrets (deploy.ps1): JWT_SECRET, DISCORD_ROOTMC_BOT_TOKEN, DISCORD_ROOTMC_CLIENT_SECRET,
#   GROK_API_BEARER_TOKEN, GROK_ROOT_ASK_BEARER_TOKEN (in-game /ask only), DISCORD_ROOTMC_WEBHOOK_URL (optional),
#   SLACK_FEEDBACK_WEBHOOK_URL (in-game /feedback → Slack #feedback), FCM_SERVICE_ACCOUNT_JSON (shop alerts),
#   ROOTMC_DEV_WORKSTATION_KEY (dev workstation heartbeat from scripts/dev-workstation-startup.ps1),
#   ROOTMC_EDGE_SIGNING_KEY (optional HMAC on cacheable public GETs), ROOTMC_TUNNEL_HEALTH_URL (edge preference watchdog),
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET (from .env STRIPE_WEBHOOK_SECRET_ROOTMC)
# Stripe webhook: POST https://api.rootmc.info/v1/stripe/webhook
#
# Discord OAuth redirect: https://api.rootmc.info/v1/discord/rootmc/callback
# Developer portal Discord register: POST /api/developer/auth/discord/start → same callback (state prefix register:)
# Interactions: POST https://api.rootmc.info/v1/discord/rootmc/interactions
# Developer pages: https://rootmc.net/developer/ (attach developer.rootmc.net to Pages rootmc-web)
name = "rootmc-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "f3372b30093435bacc35b69972abeb2e"

[[d1_databases]]
# Production primary — Cloudflare-native schema (auth, heartbeats, licenses, Discord, economy mirrors).
binding = "DB"
database_name = "rootmc"
database_id = "6cf71128-67e3-47b2-a802-d6c23d6489e0"

[[d1_databases]]
# Same physical DB as DB (alias). Legacy MySQL economy pull may target this binding explicitly.
binding = "LEGACY_DB"
database_name = "rootmc"
database_id = "6cf71128-67e3-47b2-a802-d6c23d6489e0"

[[d1_databases]]
binding = "WEBSTAT_DB"
database_name = "rootmc-webstat"
database_id = "e999ab90-08d5-485f-a813-a22aa6aead52"

# Hyperdrive MySQL full-sync mirror only (hub times, root_* tables). Not CF-native auth.
[[d1_databases]]
binding = "LIVE_DB"
database_name = "rootmc-live"
database_id = "0fae3fc8-f48d-4d6a-b31e-ddff12131d84"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "rootmc-bluemap"

[[routes]]
pattern = "api.rootmc.net"
custom_domain = true

