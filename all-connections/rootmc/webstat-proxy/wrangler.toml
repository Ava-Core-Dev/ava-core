# HTTPS proxy for Root-Webstat Paper ports.
# Deploy: powershell -File deploy.ps1
name = "rootmc-webstat-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"
account_id = "f3372b30093435bacc35b69972abeb2e"

[[routes]]
pattern = "claims.rootmc.net"
custom_domain = true

[[routes]]
pattern = "towny.rootmc.net"
custom_domain = true

# Origins must be DNS hostnames on rootmc.net (gray-cloud), not raw IPs —
# Workers fetch() to bare IPs returns error 1003; custom ports need zone DNS.
[vars]
CLAIMS_ORIGIN = "http://claims-origin.rootmc.net:28305"
TOWNY_ORIGIN = "http://towny-origin.rootmc.net:29652"
