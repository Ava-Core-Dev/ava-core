<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>502 — Ava is unreachable</title>
  <meta name="theme-color" content="#0a0e14" />
  <style>
    :root { --bg0:#000d1a; --ink:#fff; --muted:#7a92a8; --accent:#00e5ff; --line:rgba(0,229,255,.16); }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:"DM Sans",system-ui,sans-serif;
      background: radial-gradient(1100px 520px at 8% -8%, #00334d 0%, transparent 55%), linear-gradient(168deg,#000d1a,#001428); }
    .eco-bar { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:.15rem; padding:.4rem 1rem; background:#000d1a; border-bottom:1px solid var(--line); }
    .eco-bar a { color:var(--muted); text-decoration:none; font-size:.78rem; font-weight:650; letter-spacing:.06em; text-transform:uppercase; padding:.28rem .9rem; border-radius:999px; }
    .eco-bar a[aria-current="page"] { color:var(--accent); background:rgba(0,229,255,.12); }
    main { max-width:36rem; margin:12vh auto 4rem; padding:0 1.25rem; }
    .code { font-weight:800; font-size:.8rem; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin:0 0 .6rem; }
    h1 { font-weight:800; letter-spacing:-.03em; font-size:clamp(1.8rem,5vw,2.6rem); margin:0 0 .55rem; }
    p { color:var(--muted); line-height:1.5; margin:0 0 1.4rem; }
    .row { display:flex; flex-wrap:wrap; gap:.55rem; }
    a.btn { display:inline-flex; padding:.55rem .95rem; border-radius:999px; border:1px solid var(--line); text-decoration:none; font-weight:650; font-size:.88rem; color:var(--ink); }
    a.btn.primary { background:#00e5ff; color:#000d1a; border-color:#00e5ff; }
  </style>
</head>
<body>
  <nav class="eco-bar" aria-label="Ecosystem">
    <a href="https://rootrecord.info/">RootRecord</a>
    <a href="https://rootmc.net/">RootMC</a>
    <a href="https://rootrecord.info/ava/" aria-current="page">Ava</a>
  </nav>
  <main>
    <p class="code">502</p>
    <h1>Ava is unreachable</h1>
    <p>The solar Root Server did not answer. Try status, or come back after daytime start.</p>
    <div class="row">
      <a class="btn primary" href="https://rootrecord.info/ava/status">Ava status</a>
      <a class="btn" href="https://rootrecord.info/">RootRecord</a>
      <a class="btn" href="https://rootmc.net/">RootMC</a>
      <a class="btn" href="https://play.rootmc.net">play.rootmc.net</a>
    </div>
  </main>
<script src="/eco-nav.js?v=1" defer></script>
</body>
</html>
