<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposal — RootMC Governance</title>
  <link rel="stylesheet" href="/styles/rootmc.css?v=20260819ivy">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    .gov-prose { white-space: pre-wrap; line-height: 1.65; }
    .vote-bar { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1rem 0; }
    .vote-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; margin: 1rem 0; }
    .vote-stat { text-align: center; padding: .75rem; background: rgba(255,255,255,.04); border-radius: 8px; }
    .gov-vote-panel { margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid rgba(255,255,255,.08); }
  </style>
</head>
<body>
  <header class="rmc-header">
    <div class="container rmc-header-inner">
      <a class="rmc-brand" href="/"><span class="rmc-brand-mark">R</span>RootMC</a>
      <nav class="rmc-nav"><a href="/council/">Council</a><a href="/governance/proposals/">Proposals</a></nav>
    </div>
  </header>
  <main class="container" style="padding-bottom:3rem;max-width:720px;">
    <p class="wiki-breadcrumb"><a href="/council/">Council</a> · <a href="/governance/proposals/">Proposals</a> · Detail</p>
    <div id="gov-me"></div>
    <article id="content" class="rmc-card"><p class="rmc-muted">Loading…</p></article>
  </main>
  <script src="/governance/governance.js?v=20260706k"></script>
  <script>
    (async function () {
      const G = window.RootMcGovernance;
      const id = G.queryParam("id");
      const box = G.el("content");
      if (!id) { box.innerHTML = "<p>Missing proposal id.</p>"; return; }

      const me = await G.loadMe();
      G.renderStatusBanner(me, G.el("gov-me"));

      const { data } = await G.govFetch("proposals/" + encodeURIComponent(id), { method: "GET" });
      if (!data || !data.proposal) { box.innerHTML = "<p>Proposal not found.</p>"; return; }
      const p = data.proposal;
      document.title = p.title + " — RootMC";
      const body = p.synthesized_description || p.description;

      let voteHtml = "";
      if (p.poll_id) {
        voteHtml += "<section id=\"citizen-vote\" class=\"gov-vote-panel\"></section>";
      }
      if (p.bill_poll_id && p.bill_poll_id !== p.poll_id) {
        voteHtml +=
          "<section id=\"bill-vote\" class=\"gov-vote-panel\"></section>";
      }

      box.innerHTML =
        "<p class=\"market-badge\">" + G.esc(G.categoryLabel(p.category)) + " · " + G.esc(p.status) + "</p>" +
        "<h1 style=\"margin-top:0\">" + G.esc(p.title) + "</h1>" +
        "<p class=\"rmc-muted\">By " + G.esc(p.minecraft_username || "—") +
        " · " + G.fmtPct(p.submit_weight) + " power · week " + G.esc(p.week_key) +
        " · " + G.fmtDate(p.created_at) + "</p>" +
        (p.bill_id ? "<p><a href=\"/governance/bill/?id=" + encodeURIComponent(p.bill_id) + "\">Included in bill " + G.esc(p.bill_id) + "</a></p>" : "") +
        (p.synthesis_at ? "<p class=\"rmc-muted\">Discussion synthesized " + G.fmtDate(p.synthesis_at) + "</p>" : "") +
        voteHtml +
        "<div class=\"gov-prose\" style=\"margin-top:1.5rem;\">" + G.esc(body) + "</div>";

      if (p.poll_id) {
        const pollRes = await G.govFetch("votes/" + encodeURIComponent(p.poll_id), { method: "GET" });
        if (pollRes.data && pollRes.data.poll) {
          G.renderVotePanel(G.el("citizen-vote"), pollRes.data.poll, me, p.poll_id, {
            heading: "Vote on this proposal",
            note: "Weighted Council signal — compiled into the weekly bill if supported.",
          });
        }
      }
      if (p.bill_poll_id && p.bill_poll_id !== p.poll_id) {
        const billPollRes = await G.govFetch("votes/" + encodeURIComponent(p.bill_poll_id), { method: "GET" });
        if (billPollRes.data && billPollRes.data.poll) {
          G.renderVotePanel(G.el("bill-vote"), billPollRes.data.poll, me, p.bill_poll_id, {
            heading: "Weekly bill council vote",
            note: "This proposal is part of the compiled weekly bill — vote on the full bill here.",
          });
        }
      }
    })();
  </script>
</body>
</html>
