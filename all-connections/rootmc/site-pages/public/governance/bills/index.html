<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly bills — RootMC Governance</title>
  <link rel="stylesheet" href="/styles/rootmc.css?v=20260819ivy">
  <link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body>
  <header class="rmc-header">
    <div class="container rmc-header-inner">
      <a class="rmc-brand" href="/"><span class="rmc-brand-mark">R</span>RootMC</a>
      <nav class="rmc-nav"><a href="/council/">Council</a></nav>
    </div>
  </header>
  <main class="container" style="padding-bottom:3rem;">
    <p class="wiki-breadcrumb"><a href="/council/">Council</a> · Bills</p>
    <h1>Weekly <span class="gold">bills</span></h1>
    <ul id="list" style="list-style:none;padding:0;"></ul>
  </main>
  <script src="/governance/governance.js"></script>
  <script>
    (async function () {
      const G = window.RootMcGovernance;
      const { data } = await G.govFetch("bills", { method: "GET" });
      const list = G.el("list");
      const bills = (data && data.bills) || [];
      if (!bills.length) {
        list.innerHTML = '<li class="rmc-muted">No weekly bills compiled yet.</li>';
        return;
      }
      list.innerHTML = bills.map(function (b) {
        return '<li class="rmc-card" style="margin-bottom:.75rem;padding:1rem;">' +
          '<a href="/governance/bill/?id=' + encodeURIComponent(b.id) + '"><strong>' + G.esc(b.title) + '</strong></a>' +
          '<div class="rmc-muted" style="font-size:.85rem;margin-top:.35rem;">' +
          G.esc(b.status) + ' · ' + (b.item_count || 0) + ' items · week ' + G.esc(b.week_key) +
          '</div></li>';
      }).join("");
    })();
  </script>
</body>
</html>
