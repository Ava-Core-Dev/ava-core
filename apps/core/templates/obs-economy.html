<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Economy board</title>
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent;color:#f4f1ea;font-family:"Segoe UI",Inter,system-ui,sans-serif}
  .panel{position:fixed;left:48px;top:140px;width:780px;background:rgba(8,18,12,.88);border:1px solid rgba(74,222,128,.35);border-radius:20px;padding:24px 28px}
  .k{letter-spacing:.16em;text-transform:uppercase;color:#4ade80;font-size:13px;margin-bottom:10px}
  h1{margin:0 0 14px;font-size:38px}
  .row{display:flex;justify-content:space-between;margin:10px 0;font-size:22px}
  .row span:first-child{opacity:.75}
  .foot{position:fixed;left:48px;right:48px;bottom:36px;background:rgba(8,18,12,.86);border-radius:14px;padding:14px 22px;font-size:18px}
</style>
</head>
<body>
  <div class="panel">
    <div class="k">RootMC · Root-Economy</div>
    <h1 id="server">Economy Board</h1>
    <div class="row"><span>Players online</span><span id="players">—</span></div>
    <div class="row"><span>Total wallet (G)</span><span id="gold">—</span></div>
    <div class="row"><span>Kīlauea alert</span><span id="alert">—</span></div>
    <div class="row"><span>Economy multiplier</span><span id="mult">—</span></div>
  </div>
  <div class="foot" id="foot">play.rootmc.net · hourly desk audio on scene</div>
<script>
const origin='__ORIGIN__';
let lastGen=0;
async function tick(){
  try{
    const [d,g]=await Promise.all([
      fetch(origin+'/api/obs/economy-desk').then(r=>r.json()),
      fetch(origin+'/api/obs/overlay-gen').then(r=>r.json())
    ]);
    if(g.gen&&g.gen!==lastGen) lastGen=g.gen;
    document.getElementById('server').textContent=d.server||'RootMC';
    document.getElementById('players').textContent=d.players_online??'—';
    document.getElementById('gold').textContent=d.wallet_g!=null?Math.round(d.wallet_g).toLocaleString()+' G':'—';
    document.getElementById('alert').textContent=(d.kilauea_alert||'normal').toUpperCase();
    document.getElementById('mult').textContent='×'+(d.economy_multiplier||1);
  }catch(e){}
}
tick(); setInterval(tick,15000);
</script>
</body>
</html>
