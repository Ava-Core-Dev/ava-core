<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Ava Hurricane Desk</title>
<style>
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:transparent;
    color:#e8f4ff;font-family:"Segoe UI",Inter,system-ui,sans-serif;}
  .top{position:fixed;top:22px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(90deg,rgba(8,16,28,.9),rgba(12,28,44,.72));
    border:1px solid rgba(245,158,11,.35);border-radius:16px;padding:12px 22px;}
  .brand{font-size:24px;font-weight:800;letter-spacing:.04em;}
  .brand span{color:#f59e0b;}
  .live{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#fecaca;}
  .dot{width:9px;height:9px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 4px rgba(239,68,68,.25);}
  .card{position:fixed;top:110px;left:28px;width:460px;background:rgba(4,14,22,.88);
    border:1px solid rgba(245,158,11,.28);border-radius:16px;padding:16px 18px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8ba3b8;margin-bottom:8px;}
  .name{font-size:34px;font-weight:800;line-height:1.05;margin:0 0 6px;}
  .cls{color:#f59e0b;font-size:18px;font-weight:700;}
  .row{display:flex;justify-content:space-between;margin:7px 0;font-size:17px;}
  .row span:first-child{color:#9fb3c4;}
  .v{font-weight:750;font-variant-numeric:tabular-nums;}
  .warn{color:#fbbf24;}
  .hot{color:#fb7185;}
  .ok{color:#4ade80;}
  .list{margin-top:10px;}
  .item{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.08);font-size:15px;}
  .bottom{position:fixed;left:28px;right:28px;bottom:22px;
    background:rgba(4,14,22,.86);border:1px solid rgba(6,182,212,.28);border-radius:16px;padding:12px 20px;
    display:flex;justify-content:space-between;align-items:center;font-size:16px;}
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><span>HURRICANE MODE</span> · Ava Ivy</div>
    <div class="live"><span class="dot"></span><span id="head">TRACKING</span></div>
  </div>
  <div class="card" id="card"></div>
  <div class="bottom">
    <div id="footL">NHC · CPHC · JTWC · RAMMB</div>
    <div id="footR">Florida + Hawaiʻi first · ground PV stows for storms</div>
  </div>
<script>
const origin = location.origin;
const id = new URLSearchParams(location.search).get('id') || 'world';
function nm(v){ return (v==null||v==='') ? '—' : Math.round(v) + ' nm'; }
function row(k,v,cls){ return `<div class="row"><span>${k}</span><span class="v ${cls||''}">${v}</span></div>`; }
function paint(d){
  const card = document.getElementById('card');
  const st = d.storm;
  if (st){
    document.getElementById('head').textContent = (st.label || 'LIVE') + ' · ' + (st.basin_name || st.basin || '');
    const fl = st.nearest_florida_nm, hi = st.nearest_hawaii_nm;
    card.innerHTML = `
      <div class="k">${(st.id||'').toUpperCase()} · ${st.source||''}</div>
      <div class="name">${st.name||'Storm'}</div>
      <div class="cls">${st.label||''}</div>
      ${row('Winds', st.knots ? (st.knots+' kt / '+(st.mph||'?')+' mph') : '—', 'warn')}
      ${row('Pressure', st.mb ? st.mb+' mb' : '—')}
      ${row('Center', (st.lat!=null && st.lon!=null) ? (st.lat.toFixed(1)+', '+st.lon.toFixed(1)) : '—')}
      ${row('Florida', nm(fl), fl!=null && fl<800 ? 'hot' : fl!=null && fl<1500 ? 'warn' : 'ok')}
      ${row('Hawaiʻi', nm(hi), hi!=null && hi<800 ? 'hot' : hi!=null && hi<1500 ? 'warn' : 'ok')}
    `;
    document.getElementById('footL').textContent = st.advisory_url ? 'Advisory on NHC' : (st.basin_name||'Global basin');
    document.getElementById('footR').textContent = 'Focus '+ (st.focus||'global');
    return;
  }
  const title = d.title || 'Tracker';
  document.getElementById('head').textContent = title.toUpperCase();
  const list = (d.storms||[]).map(s => {
    const dist = d.slide==='florida' ? s.nearest_florida_nm : d.slide==='hawaii' ? s.nearest_hawaii_nm : s.knots;
    const distL = d.slide==='world' ? ((s.knots||'?')+' kt') : nm(dist);
    return `<div class="item"><span>${s.name} · ${s.label||''}</span><span class="v">${distL}</span></div>`;
  }).join('') || '<div class="item"><span>No active cyclones in this cut</span><span class="v ok">quiet</span></div>';
  card.innerHTML = `<div class="k">Active systems</div><div class="name">${title}</div>
    <div class="cls">${(d.all||[]).length} worldwide</div><div class="list">${list}</div>`;
}
async function tick(){
  try {
    const d = await fetch(origin+'/api/obs/hurricane-desk?id='+encodeURIComponent(id)).then(r=>r.json());
    paint(d);
  } catch(e) {}
}
tick();
setInterval(tick, 20000);
</script>
</body>
</html>
