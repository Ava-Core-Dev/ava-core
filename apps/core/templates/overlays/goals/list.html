<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Goals · List</title>
<link rel="stylesheet" href="/obs/overlays/_shared/base.css"/>

<style>

  .list{position:fixed;top:100px;left:32px;width:920px;max-height:880px;overflow:hidden;color:#fff}
  .goal{background:rgba(8,10,14,.86);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px 18px;margin-bottom:10px}
  .goal h2{margin:0 0 6px;font-size:24px}
  .goal p{margin:0;opacity:.82;font-size:16px;line-height:1.4}
  .meta{font-size:13px;opacity:.65;margin-top:6px}
  
</style>
</head>
<body>
<div class="list" id="list"></div>
<script>window.AVA_ORIGIN = "__ORIGIN__";</script>
<script src="/obs/overlays/_shared/ava.js"></script>
<script>

async function tick(){
  try{
    const d=await avaFetch('/api/goals');
    const goals=(d.goals||[]).slice(0,8);
    document.getElementById('list').innerHTML=goals.map(x=>`<div class="goal"><h2>${avaEsc(x.title||x.id)}</h2><p>${avaEsc(x.summary||x.description||'')}</p><div class="meta">${avaEsc(x.status||'active')} · priority ${x.priority_score??'—'}</div></div>`).join('')||'<div class="goal"><h2>No goals loaded</h2></div>';
  }catch(e){}
}
avaEvery(tick,20000);

</script>
</body>
</html>
