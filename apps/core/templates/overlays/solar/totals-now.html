<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Solar · Totals now</title>
<link rel="stylesheet" href="/obs/overlays/_shared/base.css"/>

<style>

  .wrap{position:fixed;top:330px;left:28px;width:448px;}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:4px;}
  .tile{background:rgba(255,255,255,.04);border-radius:10px;padding:8px 10px;}
  .tile .n{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8ba3b8;}
  .tile .x{font-size:20px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums;}
  
</style>
</head>
<body>
<div class="wrap card"><div class="k">Totals now</div>
  <div class="split">
    <div class="tile"><div class="n">PV in</div><div class="x solar" id="solar">—</div></div>
    <div class="tile"><div class="n">DC load</div><div class="x" id="load">—</div></div>
    <div class="tile"><div class="n">AC gen / xfer</div><div class="x cyan" id="ac">—</div></div>
    <div class="tile"><div class="n">Appliances</div><div class="x warn" id="appl">—</div></div>
    <div class="tile"><div class="n">Net PV−DC</div><div class="x cyan" id="net">—</div></div>
    <div class="tile"><div class="n">Bank avg</div><div class="x" id="bankAvg">—</div></div>
  </div>
  <div class="row" style="margin-top:10px"><span>State</span><span class="v cyan" id="state" style="font-size:16px;text-align:right;max-width:260px">—</span></div>
  </div>
<script>window.AVA_ORIGIN = "__ORIGIN__";</script>
<script src="/obs/overlays/_shared/ava.js"></script>
<script>

async function paint(){
  try{
    const s=await avaFetch('/api/obs/solar-desk');
    const solar=s.solar||{}, tot=solar.totals||{};
    const pv=tot.solar_in_w??solar.solar_in_w??solar.power_w;
    const load=tot.dc_load_w??tot.load_w??solar.load_w;
    const ac=(Number(tot.generator_w||0)+Number(tot.transfer_w||0))||Number(tot.ac_in_w||0)+Number(tot.ac_out_w||0);
    document.getElementById('solar').textContent=avaWatts(pv);
    document.getElementById('load').textContent=avaWatts(load);
    document.getElementById('ac').textContent=avaWatts(ac);
    document.getElementById('appl').textContent=avaWatts(tot.appliance_w);
    document.getElementById('net').textContent=avaWatts(tot.net_w??(Number(pv||0)-Number(load||0)));
    document.getElementById('bankAvg').textContent=avaPct(tot.bank_avg_pct??solar.battery_pct);
    document.getElementById('state').textContent=solar.state||'—';
  }catch(e){}
}
avaEvery(paint,8000);

</script>
</body>
</html>
