<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Weather · Bottom</title>
<link rel="stylesheet" href="/obs/overlays/_shared/base.css"/>

<style>

  .bottom{position:fixed;left:28px;right:28px;bottom:22px;background:rgba(4,14,22,.86);
    border-radius:16px;padding:12px 20px;font-size:16px;display:flex;justify-content:space-between}
  
</style>
</head>
<body>
<div class="bottom"><span>Official NWS · not an Ava forecast</span><span id="ts">—</span></div>
<script>window.AVA_ORIGIN = "__ORIGIN__";</script>
<script src="/obs/overlays/_shared/ava.js"></script>
<script>

async function pull(){
  try{ const w=await avaFetch('/api/obs/weather-desk'); document.getElementById('ts').textContent=w.ts||''; }catch(e){}
}
avaEvery(pull,12000);

</script>
</body>
</html>
