<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="refresh" content="60"/>
<title>Ava Solar Desk</title>
<style>
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:transparent;
    color:#e8f4ff;font-family:"Segoe UI",Inter,system-ui,sans-serif;}
  .top{position:fixed;top:22px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(90deg,rgba(4,18,28,.88),rgba(8,28,40,.72));
    border:1px solid rgba(0,229,255,.28);border-radius:16px;padding:12px 22px;}
  .brand{font-size:28px;font-weight:800;letter-spacing:.04em;}
  .brand span{color:#00e5ff;}
  .clock{text-align:right;}
  .clock .d{opacity:.75;font-size:14px;}
  .clock .t{font-size:28px;font-weight:700;letter-spacing:1px;}
  .rail{position:fixed;top:110px;width:430px;display:flex;flex-direction:column;gap:14px;}
  .left{left:28px;}
  .right{right:28px;}
  .card{background:rgba(4,14,22,.82);border:1px solid rgba(0,229,255,.22);border-radius:16px;padding:16px 18px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8ba3b8;margin-bottom:8px;}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:6px 0;}
  .v{font-size:28px;font-weight:750;font-variant-numeric:tabular-nums;}
  .solar{color:#ffd54a;}
  .cyan{color:#00e5ff;}
  .ok{color:#4ade80;}
  .warn{color:#fbbf24;}
  .ringwrap{display:flex;gap:14px;}
  .ring{width:190px;text-align:center;}
  .gauge{width:150px;height:150px;margin:0 auto 6px;border-radius:50%;
    background:conic-gradient(#00e5ff var(--p), rgba(255,255,255,.08) 0);
    display:grid;place-items:center;}
  .gauge>div{width:108px;height:108px;border-radius:50%;background:rgba(4,14,22,.95);
    display:grid;place-items:center;font-size:28px;font-weight:800;}
  .bottom{position:fixed;left:28px;right:28px;bottom:22px;display:flex;justify-content:space-between;align-items:center;
    background:rgba(4,14,22,.84);border:1px solid rgba(0,229,255,.22);border-radius:16px;padding:12px 20px;}
  .flow{display:flex;gap:22px;font-size:18px;}
  .flow b{color:#ffd54a;}
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><span>SOLAR DESK</span> · EcoFlow + host</div>
    <div class="clock"><div class="d" id="date"></div><div class="t" id="time"></div></div>
  </div>
  <div class="rail left">
    <div class="card">
      <div class="k">Battery bank</div>
      <div class="ringwrap" id="rings"></div>
    </div>
    <div class="card">
      <div class="k">Power</div>
      <div class="row"><span>Solar in</span><span class="v solar" id="solar">—</span></div>
      <div class="row"><span>Load out</span><span class="v" id="load">—</span></div>
      <div class="row"><span>State</span><span class="v cyan" id="state">—</span></div>
    </div>
  </div>
  <div class="rail right">
    <div class="card">
      <div class="k">Root server</div>
      <div class="row"><span>CPU</span><span class="v" id="cpu">—</span></div>
      <div class="row"><span>RAM</span><span class="v" id="ram">—</span></div>
      <div class="row"><span>Uptime</span><span class="v" id="up">—</span></div>
      <div class="row"><span>Host</span><span class="v ok" id="host">—</span></div>
    </div>
    <div class="card">
      <div class="k">Site + volcano</div>
      <div class="row"><span>Weather</span><span class="v" id="wx" style="font-size:18px">—</span></div>
      <div class="row"><span>Kīlauea</span><span class="v warn" id="kila" style="font-size:18px">—</span></div>
      <div class="row"><span>Night off</span><span class="v" id="off">—</span></div>
    </div>
  </div>
  <div class="bottom">
    <div>Ava Ivy · HI Pacific Root Server · play.rootmc.net</div>
    <div class="flow"><span>PV <b id="flowIn">0 W</b></span><span>→ bank <b id="flowBank">—</b></span><span>→ load <b id="flowOut">0 W</b></span></div>
    <div id="src" style="opacity:.7">source —</div>
  </div>
<script>
const ORIGIN = "__ORIGIN__";
function tick(){
  const n=new Date();
  document.getElementById('date').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'Pacific/Honolulu'});
  document.getElementById('time').textContent=n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Pacific/Honolulu'})+' HST';
}
function ring(label,pct){
  const p=Math.max(0,Math.min(100,Number(pct)||0));
  return `<div class="ring"><div class="gauge" style="--p:${p}%"><div>${p.toFixed(0)}%</div></div><div>${label}</div></div>`;
}
function watts(v){ if(v==null||v==='') return '—'; return Math.round(Number(v))+' W'; }
async function j(path){ const r=await fetch(ORIGIN+path); return r.json(); }
async function paint(){
  try{
    const s=await j('/api/obs/solar-desk');
    const solar=s.solar||{};
    const host=s.host||{};
    const wx=s.weather||{};
    const k=s.kilauea||{};
    const devices=solar.devices||[];
    document.getElementById('rings').innerHTML = devices.length
      ? devices.map(d=>ring(d.label||'pack', d.soc)).join('')
      : ring('Bank', solar.battery_pct);
    document.getElementById('solar').textContent=watts(solar.solar_in_w||solar.power_w);
    document.getElementById('load').textContent=watts(solar.load_w);
    document.getElementById('state').textContent=solar.state||'—';
    document.getElementById('cpu').textContent=(host.cpu_pct!=null?host.cpu_pct.toFixed(0)+'%':'—');
    document.getElementById('ram').textContent=(host.mem_pct!=null?host.mem_pct.toFixed(0)+'%':'—');
    const up=host.uptime_s||0;
    document.getElementById('up').textContent=up?Math.floor(up/3600)+'h '+Math.floor((up%3600)/60)+'m':'—';
    document.getElementById('host').textContent=host.host||'ava-core';
    document.getElementById('wx').textContent=wx.conditions||wx.forecast||'—';
    document.getElementById('kila').textContent=((k.alert_level||'advisory')+' · '+(k.headline||'not erupting')).slice(0,42);
    document.getElementById('off').textContent=(s.shutdown&&s.shutdown.timeHst)||'22:00';
    document.getElementById('flowIn').textContent=watts(solar.solar_in_w||solar.power_w);
    document.getElementById('flowBank').textContent=(solar.battery_pct!=null?solar.battery_pct+'%':'—');
    document.getElementById('flowOut').textContent=watts(solar.load_w);
    document.getElementById('src').textContent=solar.source||'';
  }catch(e){}
}
tick(); setInterval(tick,1000);
paint(); setInterval(paint,8000);
</script>
</body>
</html>
