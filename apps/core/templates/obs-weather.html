<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Weather desk</title>
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent;
    color:#e8f4ff;font-family:"Segoe UI",Inter,system-ui,sans-serif;}
  .top{position:fixed;top:22px;left:28px;right:28px;display:flex;justify-content:space-between;
    background:rgba(4,18,32,.88);border:1px solid rgba(56,189,248,.35);border-radius:16px;padding:12px 22px;}
  .brand{font-size:24px;font-weight:800}.brand span{color:#38bdf8}
  .card{position:fixed;top:110px;left:28px;width:520px;background:rgba(4,14,22,.88);
    border:1px solid rgba(56,189,248,.28);border-radius:16px;padding:16px 18px;}
  .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8ba3b8;margin-bottom:8px}
  .cond{font-size:28px;font-weight:800;margin:0 0 8px}
  .row{display:flex;justify-content:space-between;margin:6px 0;font-size:16px}
  .row span:first-child{color:#9fb3c4}
  .bottom{position:fixed;left:28px;right:28px;bottom:22px;background:rgba(4,14,22,.86);
    border-radius:16px;padding:12px 20px;font-size:16px;display:flex;justify-content:space-between}
</style>
</head>
<body>
  <div class="top"><div class="brand"><span>WEATHER BOARD</span> · NWS Hawaiʻi</div><div id="clock">—</div></div>
  <div class="card">
    <div class="k">Current</div>
    <div class="cond" id="cond">—</div>
    <div class="row"><span>Temp</span><span id="temp">—</span></div>
    <div class="row"><span>Wind</span><span id="wind">—</span></div>
    <div class="row"><span>Hazards</span><span id="haz">—</span></div>
    <div class="row"><span>Next desk</span><span id="next">Storm Desk</span></div>
  </div>
  <div class="bottom"><span>Official NWS · not an Ava forecast</span><span id="ts">—</span></div>
<script>
const origin='__ORIGIN__';
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Pacific/Honolulu'})+' HST';}
tick(); setInterval(tick,1000);
let lastGen=0;
async function pull(){
  try{
    const [w,g]=await Promise.all([
      fetch(origin+'/api/obs/weather-desk').then(r=>r.json()),
      fetch(origin+'/api/obs/overlay-gen').then(r=>r.json())
    ]);
    if(g.gen && g.gen!==lastGen){ lastGen=g.gen; document.body.style.opacity='0.99'; setTimeout(()=>document.body.style.opacity='1',80); }
    document.getElementById('cond').textContent=w.conditions||'—';
    document.getElementById('temp').textContent=w.temp_f!=null?w.temp_f+'°F':'—';
    document.getElementById('wind').textContent=w.wind||'—';
    document.getElementById('haz').textContent=w.hazards||'none';
    document.getElementById('ts').textContent=w.ts||'';
  }catch(e){}
}
pull(); setInterval(pull,12000);
</script>
</body>
</html>
