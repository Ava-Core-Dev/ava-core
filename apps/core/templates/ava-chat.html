<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Talk with Ava — Ava Ivy</title>
<meta name="description" content="Live chat with Ava Ivy on the HI Pacific Solar Root Server."/>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Georgia, "Iowan Old Style", "Segoe UI", serif;
    color: #f4efe6; background: #0a1016; line-height: 1.5;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px; padding: 1rem 1.25rem; border-bottom: 1px solid #1c2a36;
  }
  .brand { letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.72rem; font-weight: 700;
    font-family: "Segoe UI", system-ui, sans-serif; color: #ff6a2a; text-decoration: none; }
  nav { display: flex; flex-wrap: wrap; gap: 0.85rem 1.1rem; }
  nav a { font-family: "Segoe UI", system-ui, sans-serif; font-size: 0.85rem; color: #9fb0bc; text-decoration: none; }
  nav a:hover { color: #f4efe6; }
  main { max-width: 42rem; margin: 0 auto; padding: 1.4rem 1.25rem 5rem; }
  h1 { font-weight: 500; font-size: clamp(1.7rem, 4vw, 2.2rem); margin: 0 0 0.4rem; }
  .lede { color: #c5ced6; margin: 0 0 1rem; }
  select {
    background: #0d151c; color: #f4efe6; border: 1px solid #1c2a36; border-radius: 0.5rem;
    padding: 0.4rem 0.6rem; font: inherit;
  }
  .messages { min-height: 16rem; margin: 1rem 0; }
  .msg { margin: 0 0 0.75rem; }
  .msg.user p { color: #9fb0bc; }
  .bubble { margin: 0; color: #e4ddd2; }
  .avaMark { color: #3ee0c6; margin-right: 0.35rem; }
  .row { display: flex; gap: 0.5rem; }
  input[type=text] {
    flex: 1; background: #0d151c; color: #f4efe6; border: 1px solid #1c2a36;
    border-radius: 0.5rem; padding: 0.65rem 0.75rem; font: inherit;
  }
  button {
    font-family: "Segoe UI", system-ui, sans-serif; background: #ff6a2a; color: #140c08;
    border: 0; border-radius: 0.5rem; padding: 0.65rem 0.9rem; font-weight: 700; cursor: pointer;
  }
  .bubble-float {
    position: fixed; right: 1.1rem; bottom: 1.1rem; width: 4.2rem; height: 4.2rem;
    border-radius: 50%; border: 2px solid #3ee0c6; overflow: hidden; background: #122;
    box-shadow: 0 8px 24px #0008; text-decoration: none; display: flex; align-items: center; justify-content: center;
  }
  .bubble-float img { width: 100%; height: 100%; object-fit: cover; }
  .live { position: fixed; right: 0.8rem; bottom: 5.4rem; font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 0.72rem; color: #3ee0c6; background: #0d151c; border: 1px solid #1c2a36;
    border-radius: 999px; padding: 0.25rem 0.55rem; }
</style>
</head>
<body>
<header>
  <a class="brand" href="https://avaivy.cloud/" target="_top">Ava Ivy</a>
  <nav>
    <a href="https://rootrecord.cloud/" target="_top">RootRecord</a>
    <a href="https://rootrecord.cloud/status" target="_top">Status</a>
    <a href="https://rootmc.net/" target="_top">RootMC</a>
    <a href="https://kilauea.cloud/" target="_top">Kīlauea</a>
  </nav>
</header>
<main>
  <h1>Talk with Ava</h1>
  <p class="lede">Local on the HI Pacific Solar Root Server. Pick a voice, then ask.</p>
  <label>Voice
    <select id="surface">
      <option value="public">Ava — public</option>
      <option value="rootmc">RootMC help</option>
      <option value="kilauea">Kīlauea / weather</option>
    </select>
  </label>
  <div class="messages" id="log"></div>
  <div class="row">
    <input id="q" type="text" placeholder="Ask Ava something…" autocomplete="off"/>
    <button type="button" id="send">Send</button>
  </div>
</main>
<p class="live">Live Chat Available</p>
<a class="bubble-float" href="https://avaivy.cloud/" title="Live Chat Available" target="_top">
  <img src="https://rootrecord.cloud/api/site-backgrounds/file/character" alt="Ava" onerror="this.remove()"/>
</a>
<script>
const log = document.getElementById("log");
function add(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = (role === "ava" ? '<span class="avaMark">◈</span>' : "") + '<p class="bubble"></p>';
  d.querySelector("p").textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
add("ava", "I'm Ava Ivy. Ask about the host, weather, packs, Kīlauea, or RootMC.");
const history = [];
async function send() {
  const input = document.getElementById("q");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  add("user", text);
  history.push({ role: "user", content: text });
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({
        message: text,
        surface: document.getElementById("surface").value,
        history: history.slice(-10),
      }),
    });
    const d = await r.json().catch(() => ({}));
    const reply = d.reply || d.error || "I could not answer just then.";
    add("ava", reply);
    history.push({ role: "assistant", content: reply });
  } catch {
    add("ava", "Connection dropped. The Root Server may be on night bank. Try again in a bit.");
  }
}
document.getElementById("send").onclick = send;
document.getElementById("q").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
