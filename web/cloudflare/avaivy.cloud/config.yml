# Ava Ivy only — local reference for the public hostnames.
# Runtime uses tunnel.token with token-run.yml; Cloudflare supplies active ingress remotely.
ingress:
  - hostname: avaivy.cloud
    service: http://127.0.0.1:8080
  - hostname: www.avaivy.cloud
    service: http://127.0.0.1:8080
  - hostname: directory.avaivy.cloud
    service: http://127.0.0.1:8080
  - service: http_status:404
